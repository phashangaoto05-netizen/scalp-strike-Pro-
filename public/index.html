<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCALP STRIKE V6 PRO</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #08111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 30px auto;
      padding: 24px;
      background: #111e31;
      border: 1px solid #263c59;
      border-radius: 18px;
    }

    h1 {
      color: #40b9ff;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #a9bbd1;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    select, input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    select, input {
      color: white;
      background: #08111f;
      border: 1px solid #38516f;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: 0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #buy { background: #138a59; }
    #sell { background: #c53c4b; }

    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #08111f;
      color: #ffd166;
      overflow-wrap: anywhere;
    }

    .warning {
      color: #a9bbd1;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>SCALP STRIKE V6 PRO</h1>
    <p class="subtitle">Trading Control Dashboard</p>

    <label for="symbol">Trading instrument</label>
    <select id="symbol">
      <option value="XAUUSD">Gold (XAUUSD)</option>
      <option value="EURUSD">EURUSD</option>
      <option value="GBPUSD">GBPUSD</option>
      <option value="USDJPY">USDJPY</option>
      <option value="AUDUSD">AUDUSD</option>
      <option value="USDCHF">USDCHF</option>
      <option value="USDCAD">USDCAD</option>
      <option value="NZDUSD">NZDUSD</option>
    </select>

    <label for="lot">Lot size</label>
    <input id="lot" type="number" min="0.01" max="0.01"
           step="0.01" value="0.01">

    <label for="sl">Stop loss (points)</label>
    <input id="sl" type="number" min="0" value="300">

    <label for="tp">Take profit (points)</label>
    <input id="tp" type="number" min="0" value="600">

    <div class="buttons">
      <button id="buy" type="button">BUY</button>
      <button id="sell" type="button">SELL</button>
    </div>

    <div id="status" role="status">
      Status: Demo interface only. Trading is not connected.
    </div>

    <p class="warning">
      Safety notice: These buttons do not place trades yet.
      Backend authentication and an MT5 demo connection must
      be implemented and tested before trading can be enabled.
    </p>
  </main>

  <script>
    const statusBox = document.getElementById("status");

    function preview(action) {
      const symbol = document.getElementById("symbol").value;
      statusBox.textContent =
        action + " selected for " + symbol +
        ". Preview only: no order has been sent.";
    }

    document.getElementById("buy").addEventListener(
      "click", () => preview("BUY")
    );

    document.getElementById("sell").addEventListener(
      "click", () => preview("SELL")
    );
  </script>
</body>
  </html>
